<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waddy Mail - 完全版</title>
    <style>
        :root { --google-blue: #1a73e8; --bg-gray: #f6f8fc; --border: #e0e2e6; }
        body { margin: 0; font-family: sans-serif; background: var(--bg-gray); display: flex; height: 100vh; }
        #sidebar { width: 280px; background: white; border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 10px; }
        .compose-btn { background: #c2e7ff; border: none; padding: 18px; border-radius: 16px; font-weight: bold; cursor: pointer; margin-bottom: 20px; }
        #mail-list { flex: 1; overflow-y: auto; }
        .mail-item { padding: 12px; border-bottom: 1px solid #f1f3f4; cursor: pointer; font-size: 14px; }
        .mail-item.unread { font-weight: bold; background: #fff; border-left: 4px solid var(--google-blue); }
        #main { flex: 1; display: flex; flex-direction: column; background: white; margin: 8px; border-radius: 16px; overflow: hidden; }
        #view-area, #compose-area { padding: 30px; display: none; }
        .active { display: block !important; }
        input, textarea, select { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid var(--border); border-radius: 8px; box-sizing: border-box; }
        button.send { background: var(--google-blue); color: white; border: none; padding: 10px 24px; border-radius: 20px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div id="sidebar">
    <button id="btn-compose" class="compose-btn">＋ 作成</button>
    <div id="mail-list">読み込み中...</div>
    <div id="footer" style="font-size:10px; color:gray; padding:10px; border-top:1px solid #eee;">
        User: <span id="my-id-display">---</span>
    </div>
</div>

<div id="main">
    <div id="view-area">
        <h2 id="v-subject">件名</h2>
        <p id="v-sender" style="font-weight:bold;"></p>
        <hr>
        <div id="v-body" style="white-space: pre-wrap;"></div>
    </div>

    <div id="compose-area">
        <h2>新しいメッセージ</h2>
        <select id="toId"><option value="">宛先を選択...</option></select>
        <input type="text" id="subject" placeholder="件名">
        <textarea id="body" rows="10" placeholder="メッセージを入力..."></textarea>
        <button id="btn-send" class="send">送信</button>
        <p id="send-status"></p>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
    import { getFirestore, collection, addDoc, updateDoc, doc, serverTimestamp, query, where, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCWP-3yPtIoghRcF0AZwqFTMfNvH1kpZ9o",
        authDomain: "waddy-portal.firebaseapp.com",
        projectId: "waddy-portal",
        storageBucket: "waddy-portal.firebasestorage.app",
        messagingSenderId: "89997369271",
        appId: "1:89997369271:web:ea882a0832054a71655232"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // --- 1. ログインユーザーの確定 (ここがundefinedだとエラーになる) ---
    const localData = localStorage.getItem('waddy_user');
    const userData = localData ? JSON.parse(localData) : { id: "waddy01", name: "テストユーザー" };
    const MY_ID = userData.id || "waddy01"; 

    document.getElementById('my-id-display').innerText = `${userData.name} (${MY_ID})`;

    // --- 2. 宛先リスト取得 (GAS) ---
    async function loadUserList() {
        const select = document.getElementById('toId');
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwIguaS571VqZfqvw19_LkkU124yR-XB4TB1R0MBpiQpDGZHNQDB6b_Y_cB1NzjSpeL/exec"; 
        
        try {
            if (GAS_URL.includes("ここに")) throw new Error("URL未設定");
            const res = await fetch(GAS_URL);
            const users = await res.json();
            users.forEach(u => {
                if(u.id !== MY_ID) {
                    const opt = document.createElement('option');
                    opt.value = u.id; opt.innerText = `${u.name} (${u.id})`;
                    select.appendChild(opt);
                }
            });
        } catch(e) {
            console.warn("GAS読み込みスキップ:", e.message);
            // 失敗時の予備
            const opt = document.createElement('option');
            opt.value = "waddy01"; opt.innerText = "自分宛 (waddy01)";
            select.appendChild(opt);
        }
    }

    // --- 3. 受信監視 (MY_IDが確定してから実行) ---
    function startListening() {
        const q = query(collection(db, "messages"), where("receiverId", "==", MY_ID), orderBy("timestamp", "desc"));
        onSnapshot(q, (snapshot) => {
            const list = document.getElementById('mail-list');
            list.innerHTML = "";
            if (snapshot.empty) {
                list.innerHTML = '<p style="text-align:center; color:gray;">メールはありません</p>';
                return;
            }
            snapshot.forEach(d => {
                const data = d.data();
                const item = document.createElement('div');
                item.className = `mail-item ${data.isRead ? '' : 'unread'}`;
                item.innerHTML = `<div>${data.senderId}</div><div style="font-size:12px; color:gray;">${data.subject}</div>`;
                item.addEventListener('click', () => showMail(d.id, data));
                list.appendChild(item);
            });
        }, (err) => {
            console.error("受信エラー:", err);
            // インデックスエラーが出たらここにURLが出る
        });
    }

    // --- 4. 画面切り替え & 送信処理 (EventListenerで登録) ---
    
    // メール詳細表示
    async function showMail(docId, data) {
        document.getElementById('compose-area').classList.remove('active');
        document.getElementById('view-area').classList.add('active');
        document.getElementById('v-subject').innerText = data.subject;
        document.getElementById('v-sender').innerText = `From: ${data.senderId}`;
        document.getElementById('v-body').innerText = data.body;
        if (!data.isRead) {
            await updateDoc(doc(db, "messages", docId), { isRead: true });
        }
    }

    // 「作成」ボタン
    document.getElementById('btn-compose').addEventListener('click', () => {
        document.getElementById('view-area').classList.remove('active');
        document.getElementById('compose-area').classList.add('active');
    });

    // 「送信」ボタン
    document.getElementById('btn-send').addEventListener('click', async () => {
        const toId = document.getElementById('toId').value;
        const subject = document.getElementById('subject').value;
        const body = document.getElementById('body').value;
        const status = document.getElementById('send-status');

        if (!toId || !subject || !body) return alert("全部入力してください");

        try {
            status.innerText = "送信中...";
            await addDoc(collection(db, "messages"), {
                senderId: MY_ID,
                receiverId: toId,
                subject: subject,
                body: body,
                timestamp: serverTimestamp(),
                isRead: false
            });
            status.innerText = "✅ 送信完了";
            setTimeout(() => {
                status.innerText = "";
                document.getElementById('compose-area').classList.remove('active');
            }, 1000);
        } catch(e) { status.innerText = "❌ 送信失敗"; }
    });

    // 起動
    loadUserList();
    startListening();

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メンテナンス中 | WaddyDog Portal</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-color);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: #1e293b;
        }

        .container {
            text-align: center;
            background: white;
            padding: 60px 40px;
            border-radius: 30px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 90%;
        }

        .icon {
            font-size: 80px;
            margin-bottom: 20px;
            display: inline-block;
            animation: sleep 2s infinite ease-in-out;
        }

        /* 犬が寝ているようなふわふわした動き */
        @keyframes sleep {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 10px;
            font-size: 24px;
        }

        p {
            line-height: 1.6;
            color: #64748b;
            margin-bottom: 30px;
        }

        .status-badge {
            display: inline-block;
            background: #fef3c7;
            color: #d97706;
            padding: 8px 20px;
            border-radius: 99px;
            font-weight: bold;
            font-size: 14px;
        }

        .loading-dots {
            margin-top: 20px;
        }

        .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--primary-color);
            border-radius: 50%;
            margin: 0 4px;
            animation: dot-blink 1.4s infinite;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dot-blink {
            0%, 80%, 100% { opacity: 0.3; }
            40% { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="icon">🐶💤</div>
    <h1>メンテナンス中</h1>
    <p>
        より快適なサイトにするため、<br>
        ワッディードッグのサイトを現在、一生懸命整備をしています。<br>
        終了まで今しばらくお待ちください。
    </p>
    
    <div class="status-badge">作業進捗：サイトを確認中</div>

    <div class="loading-dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>
</div>

</body>
</html>

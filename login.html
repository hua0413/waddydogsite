<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社員ログイン - ワッディードック</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-container { max-width: 400px; margin: 50px auto; padding: 30px; text-align: center; background: #fff; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .hidden { display: none; }
        input { width: 90%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; }
        button { width: 95%; padding: 12px; background: #4285f4; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #ccc; }
        #error { color: #ff4d4d; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <div id="login-form" class="login-container">
        <h2>社員ログイン</h2>
        <p>IDとパスワードを入力してください</p>
        <input type="text" id="userId" placeholder="社員ID">
        <input type="password" id="userPass" placeholder="パスワード">
        <button id="loginBtn" onclick="login()">ログイン</button>
        <p id="error"></p>
    </div>

    <div id="staff-page" class="login-container hidden">
        <h2 id="welcome-msg"></h2>
        <p>社員専用ページへようこそ。</p>
        <hr>
        <div style="text-align: left; background: #f9f9f9; padding: 15px; border-radius: 8px;">
            <p><strong>【本日のお知らせ】</strong></p>
            <p>・松阪駅前での活動報告を更新しました。</p>
            <p>・備品のドッグフードの在庫が少なくなっています。</p>
        </div>
        <br>
        <button onclick="location.reload()" style="background: #666;">ログアウト</button>
    </div>

    <script>
        // 💡 1. ここに、さっきコピーした「ウェブアプリ URL」を貼り付けてください
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwIguaS571VqZfqvw19_LkkU124yR-XB4TB1R0MBpiQpDGZHNQDB6b_Y_cB1NzjSpeL/exec"; 

        async function login() {
            const id = document.getElementById("userId").value;
            const pass = document.getElementById("userPass").value;
            const btn = document.getElementById("loginBtn");
            const errorElement = document.getElementById("error");

            if (!id || !pass) {
                errorElement.innerText = "IDとパスワードを入力してください";
                return;
            }

            btn.disabled = true;
            btn.innerText = "照合中...";
            errorElement.innerText = "";

            try {
                // 💡 2. GASにIDとパスワードを送って確認してもらう
                const response = await fetch(`${GAS_URL}?id=${id}&pass=${pass}`);
                const result = await response.json();

                if (result.success) {
                    // ログイン成功：名前を表示
                    document.getElementById("login-form").classList.add("hidden");
                    document.getElementById("staff-page").classList.remove("hidden");
                    document.getElementById("welcome-msg").innerText = "ようこそ、" + result.name + "さん！";
                } else {
                    // ログイン失敗
                    errorElement.innerText = result.message || "ログインに失敗しました";
                }
            } catch (e) {
                errorElement.innerText = "エラーが発生しました。時間を置いて試してください。";
                console.error(e);
            } finally {
                btn.disabled = false;
                btn.innerText = "ログイン";
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaddyDog Portal | 社員専用ページ</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --accent-yellow: #f59e0b;
        }

        body {
            margin: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        /* ログイン画面のデザイン */
        .login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        /* マイページ全体のデザイン（PC対応） */
        .dashboard {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            display: grid;
            grid-template-columns: 300px 1fr; /* 左にプロフィール、右にコンテンツ */
            gap: 30px;
        }

        @media (max-width: 768px) {
            .dashboard { grid-template-columns: 1fr; } /* スマホでは縦並び */
        }

        /* 左側：プロフィールカード */
        .side-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            text-align: center;
            height: fit-content;
        }

        .avatar-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 20px;
            border: 4px solid var(--primary-color);
            object-fit: cover;
            background: #eee;
        }

        .badge {
            background: #dbeafe;
            color: var(--primary-color);
            padding: 4px 12px;
            border-radius: 99px;
            font-weight: bold;
            font-size: 14px;
        }

        /* 右側：コンテンツエリア */
        .main-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .status-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* 進捗バーの豪華版 */
        .progress-wrapper {
            background: #e2e8f0;
            border-radius: 10px;
            height: 24px;
            margin: 15px 0;
            position: relative;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #2563eb, #60a5fa);
            height: 100%;
            width: 0%;
            transition: width 1.5s cubic-bezier(0.1, 0, 0, 1);
        }

        /* メッセージ板のデザイン */
        .memo-area {
            background: #fffbeb;
            border-left: 6px solid var(--accent-yellow);
            padding: 20px;
            border-radius: 12px;
            font-size: 18px;
            line-height: 1.6;
        }

        /* 共通ボタン */
        .btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn:hover { transform: translateY(-2px); opacity: 0.9; }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .hidden { display: none; }
        /* 追加：ホーム戻るボタンのデザイン */
.back-to-home {
    position: absolute;
    top: 20px;
    left: 20px;
    text-decoration: none;
    color: #64748b;
    font-size: 14px;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: 0.3s;
    padding: 8px 16px;
    background: white;
    border-radius: 8px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
}

.back-to-home:hover {
    color: var(--primary-color);
    transform: translateX(-3px);
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

/* スマホでは少し位置を調整 */
@media (max-width: 768px) {
    .back-to-home {
        top: 10px;
        left: 10px;
    }
}
    </style>
</head>
<body>
    <a href="index.html" class="back-to-home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        ホームへ戻る
    </a>

<div id="login-form" class="login-screen">
    <div class="login-card">
        <h2 style="margin-bottom: 8px;">WaddyDog Portal</h2>
        <p style="color: #64748b; margin-bottom: 24px;">社員認証を行ってください</p>
        <input type="text" id="userId" placeholder="社員ID">
        <input type="password" id="userPass" placeholder="パスワード">
        <button id="loginBtn" class="btn" style="width: 100%; margin-top: 10px;" onclick="login()">ログイン</button>
        <p id="error" style="color: #ef4444; margin-top: 15px; font-size: 14px;"></p>
    </div>
</div>

<div id="staff-page" class="dashboard hidden">
    <aside class="side-card">
        <img id="user-img" src="https://via.placeholder.com/150" class="avatar-circle">
        <div style="margin-bottom: 10px;"><span id="user-role" class="badge">役職</span></div>
        <h2 id="welcome-msg" style="margin: 10px 0;">名前 さん</h2>
        <p style="color: #64748b; font-size: 14px;">WaddyDog Projectメンバー</p>
        <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 20px 0;">
        <button onclick="logout()" class="btn" style="background: #64748b; width: 100%;">ログアウト</button>
    </aside>

    <main class="main-content">
        <div class="status-card">
            <h3 style="margin-top: 0;">📊 個人進捗ステータス</h3>
            <div class="progress-wrapper">
                <div id="progress-fill" class="progress-fill"></div>
            </div>
            <div style="display: flex; justify-content: space-between; font-weight: bold;">
                <span>達成度</span>
                <span><span id="progress-text">0</span>%</span>
            </div>
        </div>

        <div class="status-card">
            <h3 style="margin-top: 0;">✉️ あなたへの個別指示</h3>
            <div id="user-msg" class="memo-area">
                指示事項を読み込んでいます...
            </div>
        </div>

        <div class="status-card">
            <h3 style="margin-top: 0;">📢 全社共通トピックス</h3>
            <ul style="padding-left: 20px; color: #475569;">
                <li>社員専用ページ完成！</li>
                <li>投稿は考えてリクエストするように</li>
            </ul>
        </div>
    </main>
</div>

<script>
    /* --- login.html の scriptの最初 --- */
window.addEventListener('DOMContentLoaded', () => {
    const savedUser = JSON.parse(localStorage.getItem('waddy_user'));
    if (savedUser) {
        // すでにログイン情報があれば、フォームを隠してマイページを表示
        showMyPage(savedUser);
    }
});

// マイページを表示する共通関数
function showMyPage(user) {
    document.getElementById("login-form").classList.add("hidden");
    document.getElementById("staff-page").classList.remove("hidden");
    
    document.getElementById("welcome-msg").innerText = user.name + " さん";
    document.getElementById("user-role").innerText = user.role || "社員";
    document.getElementById("user-msg").innerText = user.message || "指示なし";
    document.getElementById("user-img").src = user.img || "https://via.placeholder.com/150";
    
    // 進捗バー
    const p = user.progress || 0;
    setTimeout(() => {
        const fill = document.getElementById("progress-fill");
        if(fill) fill.style.width = p + "%";
        const text = document.getElementById("progress-text");
        if(text) text.innerText = p;
    }, 300);
}
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwIguaS571VqZfqvw19_LkkU124yR-XB4TB1R0MBpiQpDGZHNQDB6b_Y_cB1NzjSpeL/exec"; 

    async function login() {
        const id = document.getElementById("userId").value;
        const pass = document.getElementById("userPass").value;
        const btn = document.getElementById("loginBtn");
        const error = document.getElementById("error");

        if(!id || !pass) { error.innerText = "入力してください"; return; }

        btn.disabled = true;
        btn.innerText = "認証中...";

        try {
            const response = await fetch(`${GAS_URL}?id=${id}&pass=${pass}`);
            const result = await response.json();

            if (result.success) {
            // ブラウザにログイン情報を保存（ここを追加！）
            const userData = {
                name: result.name,
                role: result.role,
                img: result.img || "https://via.placeholder.com/150",
                message: result.message,
                progress: result.progress
            };
                localStorage.setItem('waddy_user', JSON.stringify(userData));

            // その後の表示処理
                document.getElementById("login-form").classList.add("hidden");
                document.getElementById("staff-page").classList.remove("hidden");
                
                // データをセット
                document.getElementById("welcome-msg").innerText = result.name + " さん";
                document.getElementById("user-role").innerText = result.role || "一般社員";
                document.getElementById("user-msg").innerText = result.message || "現在、特別な指示はありません。";
                document.getElementById("user-img").src = result.img || "https://via.placeholder.com/150";
                
                // バーのアニメーション
                const p = result.progress || 0;
                setTimeout(() => {
                    document.getElementById("progress-fill").style.width = p + "%";
                    document.getElementById("progress-text").innerText = p;
                }, 300);

            } else {
                error.innerText = result.message;
            }
        } catch (e) {
            error.innerText = "通信エラー";
        } finally {
            btn.disabled = false;
            btn.innerText = "ログイン";
        }
    }
    function logout() {
    // 1. ブラウザに保存した社員情報を完全に削除する
    localStorage.removeItem('waddy_user');

    // 2. 念のためすべての保存データをクリアしたい場合はこちら（オプション）
    // localStorage.clear();

    // 3. ホーム画面に戻す
    // これにより、index.html側でも「ログイン情報なし」と判定され、
    // 右上のボタンが「社員専用」に戻ります。
    window.location.href = "index.html";
}
</script>
</body>
</html>

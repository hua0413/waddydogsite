<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waddy Mail - 社内メッセージシステム</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f1f5f9;
            --text: #1e293b;
            --border: #e2e8f0;
        }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
            background-color: var(--bg);
            color: var(--text);
        }
        /* 左側：サイドバー */
        #sidebar {
            width: 320px;
            background: white;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }
        #sidebar-header {
            padding: 20px;
            background: var(--primary);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #mail-list {
            flex: 1;
            overflow-y: auto;
        }
        .mail-item {
            padding: 15px;
            border-bottom: 1px solid #f1f5f9;
            cursor: pointer;
            transition: 0.2s;
        }
        .mail-item:hover { background: #f8fafc; }
        .mail-item.unread { border-left: 4px solid var(--primary); background: #eff6ff; }
        .mail-subject { font-weight: bold; font-size: 0.9rem; display: block; }
        .mail-sender { font-size: 0.8rem; color: #64748b; }

        /* 右側：メインコンテンツ */
        #main {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        .logout-btn {
            background: none;
            border: 1px solid white;
            color: white;
            padding: 4px 8px;
            font-size: 0.7rem;
            width: auto;
        }
    </style>
</head>
<body id="app-body" style="display: none;">

<div id="sidebar">
    <div id="sidebar-header">
        <span>📩 受信トレイ</span>
        <button class="logout-btn" onclick="logout()">ログアウト</button>
    </div>
    <div id="mail-list">
        </div>
</div>

<div id="main">
    <div class="card">
        <h3 style="margin:0;">👤 ログインユーザー: <span id="user-display">---</span></h3>
    </div>

    <div class="card">
        <h3>✍️ 新規メッセージ作成</h3>
        <input type="text" id="toId" placeholder="宛先の社員ID">
        <input type="text" id="subject" placeholder="件名">
        <textarea id="body" rows="6" placeholder="メッセージ本文を入力してください..."></textarea>
        <button id="sendBtn">メッセージを送信する</button>
        <p id="status" style="text-align:center; font-size:0.8rem; margin-top:10px;"></p>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
    import { 
        getFirestore, collection, addDoc, serverTimestamp, 
        query, where, orderBy, onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

    // --- 1. Firebase設定 (自分のものに書き換え) ---
  const firebaseConfig = {
    apiKey: "AIzaSyCWP-3yPtIoghRcF0AZwqFTMfNvH1kpZ9o",
    authDomain: "waddy-portal.firebaseapp.com",
    projectId: "waddy-portal",
    storageBucket: "waddy-portal.firebasestorage.app",
    messagingSenderId: "89997369271",
    appId: "1:89997369271:web:ea882a0832054a71655232"
  };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // --- 2. 認証チェック ---
    const userData = localStorage.getItem('waddy_user');
    let currentUser = null;

    if (!userData) {
        alert("ログインが必要です。");
        // テスト環境でログイン画面がない場合は、下の一行をコメントアウトして、その下のテスト用ユーザーを有効にしてください。
        // window.location.href = "index.html"; 
        
        // テスト用強制ログイン (開発時のみ)
        currentUser = { id: "waddy01", name: "テスト太郎" };
    } else {
        currentUser = JSON.parse(userData);
    }

    // ユーザーが正常に取得できた場合のみアプリ起動
    if (currentUser && currentUser.id) {
        document.getElementById('app-body').style.display = 'flex';
        document.getElementById('user-display').innerText = `${currentUser.name} (${currentUser.id})`;
        initApp(currentUser.id);
    }

    function initApp(myId) {
        // --- 3. 受信監視 (リアルタイム) ---
        const q = query(
            collection(db, "messages"),
            where("receiverId", "==", myId),
            orderBy("timestamp", "desc")
        );

        onSnapshot(q, (snapshot) => {
            const list = document.getElementById('mail-list');
            list.innerHTML = "";

            if (snapshot.empty) {
                list.innerHTML = '<p style="padding:20px; color:#94a3b8; text-align:center;">メッセージはありません</p>';
                return;
            }

            snapshot.forEach((doc) => {
                const data = doc.data();
                const item = document.createElement('div');
                item.className = 'mail-item';
                item.innerHTML = `
                    <span class="mail-sender">From: ${data.senderId}</span>
                    <span class="mail-subject">${data.subject}</span>
                `;
                item.onclick = () => alert(`【本文】\n${data.body}`);
                list.appendChild(item);
            });
        }, (err) => {
            console.error("Firestore Error:", err);
            if(err.code === 'failed-precondition') {
                alert("Firebaseのインデックス作成が必要です。コンソールのエラーログを確認してください。");
            }
        });

        // --- 4. 送信処理 ---
        document.getElementById('sendBtn').addEventListener('click', async () => {
            const toId = document.getElementById('toId').value.trim();
            const subject = document.getElementById('subject').value.trim();
            const body = document.getElementById('body').value.trim();
            const status = document.getElementById('status');

            if (!toId || !subject || !body) {
                alert("未入力の項目があります。");
                return;
            }

            try {
                status.innerText = "送信中...";
                await addDoc(collection(db, "messages"), {
                    senderId: myId,
                    receiverId: toId,
                    subject: subject,
                    body: body,
                    timestamp: serverTimestamp(),
                    isRead: false
                });
                status.innerText = "✅ 送信完了！";
                document.getElementById('toId').value = "";
                document.getElementById('subject').value = "";
                document.getElementById('body').value = "";
                setTimeout(() => status.innerText = "", 3000);
            } catch (e) {
                console.error("Send Error:", e);
                status.innerText = "❌ エラーが発生しました。";
            }
        });
    }

    // ログアウト用
    window.logout = () => {
        localStorage.removeItem('waddy_user');
        window.location.reload();
    };
</script>
</body>
</html>

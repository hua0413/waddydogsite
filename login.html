<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaddyDog Portal | 社員専用ページ</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --accent-yellow: #f59e0b;
        }

        body {
            margin: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        /* ログイン画面のデザイン */
        .login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        /* マイページ全体のデザイン（PC対応） */
        .dashboard {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .dashboard { grid-template-columns: 1fr; }
        }

        /* 左側：プロフィールカード */
        .side-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            text-align: center;
            height: fit-content;
        }

        .avatar-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid var(--primary-color);
            margin: 0 auto 20px;
            object-fit: cover;
            background: #eee;
        }

        .badge {
            background: #dbeafe;
            color: var(--primary-color);
            padding: 4px 12px;
            border-radius: 99px;
            font-weight: bold;
            font-size: 14px;
        }

        /* コンテンツエリア */
        .main-content { display: flex; flex-direction: column; gap: 20px; }
        .status-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .memo-area {
            background: #fffbeb;
            border-left: 6px solid var(--accent-yellow);
            padding: 20px;
            border-radius: 12px;
            font-size: 18px;
            line-height: 1.6;
        }

        .btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            display: block;
            width: 100%;
            margin-top: 10px;
        }
        .btn:hover { transform: translateY(-2px); opacity: 0.9; }

        input {
            width: 100%; padding: 12px; margin: 10px 0;
            border: 1px solid #e2e8f0; border-radius: 8px; box-sizing: border-box;
        }

        .hidden { display: none; }

        .back-to-home {
            position: absolute; top: 20px; left: 20px; text-decoration: none;
            color: #64748b; font-size: 14px; font-weight: bold;
            display: flex; align-items: center; gap: 5px;
            padding: 8px 16px; background: white; border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* ポップアップ用CSS */
        #pw-check-popup {
            display: none; position: fixed; inset: 0; z-index: 9999;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
            align-items: center; justify-content: center;
        }
        .popup-card {
            background: white; padding: 35px; border-radius: 24px;
            width: 90%; max-width: 400px; text-align: center;
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-to-home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        ホームへ戻る
    </a>

<div id="login-form" class="login-screen">
    <div class="login-card">
        <h2 style="margin-bottom: 8px;">WaddyDog Portal</h2>
        <p style="color: #64748b; margin-bottom: 24px;">社員認証を行ってください</p>
        <input type="text" id="userId" placeholder="社員ID">
        <input type="password" id="userPass" placeholder="パスワード">
        <button id="loginBtn" class="btn" onclick="login()">ログイン</button>
        <p id="error" style="color: #ef4444; margin-top: 15px; font-size: 14px;"></p>
    </div>
</div>

<div id="staff-page" class="dashboard hidden">
    <aside class="side-card">
        <img id="user-img" src="https://via.placeholder.com/150" class="avatar-circle">
        <div style="margin-bottom: 10px;"><span id="user-role" class="badge">役職</span></div>
        <h2 id="welcome-msg" style="margin: 10px 0;">名前 さん</h2>
        <p style="color: #64748b; font-size: 14px;">WaddyDog Projectメンバー</p>
        <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 20px 0;">
        
        <button onclick="window.location.href='pw-change.html?mode=anytime'" class="btn" style="background: #1e293b; font-size: 13px;">
            🔒 パスワード変更
        </button>

        <button onclick="logout()" class="btn" style="background: #64748b;">ログアウト</button>
    </aside>

    <main class="main-content">
        <div class="status-card">
            <h3 style="margin-top: 0;">✉️ あなたへの個別指示</h3>
            <div id="user-msg" class="memo-area">指示事項を読み込んでいます...</div>
        </div>

        <div class="status-card">
            <h3 style="margin-top: 0;">📢 全社共通トピックス</h3>
            <ul style="padding-left: 20px; color: #475569;">
                <li>社員専用ページ完成！</li>
                <li>パスワードの定期的な更新をお願いします</li>
            </ul>
        </div>

        <div class="status-card">
            <h3>⚙️ アイコン設定</h3>
            <input type="text" id="new-img-url" placeholder="画像のURLを入力">
            <button onclick="updateIcon()" class="btn" style="background: #34a853;">更新</button>
        </div>
    </main>
</div>

<div id="pw-check-popup">
    <div class="popup-card">
        <div style="font-size:50px; margin-bottom:15px;">🔐</div>
        <h2 id="pw-popup-title" style="margin:0 0 10px; color:var(--primary-color);"></h2>
        <p id="pw-popup-msg" style="margin:0 0 30px; color:#5f6368; font-size:14px; line-height:1.6;"></p>
        <button id="pw-next-btn" class="btn">変更画面へ進む</button>
        <button id="pw-later-btn" onclick="closePwPopup()" style="background:none; border:none; color:#70757a; cursor:pointer; font-size:14px; text-decoration:underline; margin-top:15px; display:none;">
            後で変更する
        </button>
    </div>
</div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwIguaS571VqZfqvw19_LkkU124yR-XB4TB1R0MBpiQpDGZHNQDB6b_Y_cB1NzjSpeL/exec"; 

    // 読み込み時：ログイン済みなら表示、そうでなければメンテチェック
    window.addEventListener('DOMContentLoaded', async () => {
        const savedUser = JSON.parse(localStorage.getItem('waddy_user'));
        if (savedUser) {
            showMyPage(savedUser);
        } else {
            checkMaintenance();
        }
    });

    async function checkMaintenance() {
        try {
            const res = await fetch(GAS_URL);
            const data = await res.json();
            if (data.maintenance && !window.location.href.includes("maintenance.html")) {
                window.location.href = "maintenance.html";
            }
        } catch (e) {}
    }

    async function login() {
        const id = document.getElementById("userId").value;
        const pass = document.getElementById("userPass").value;
        const btn = document.getElementById("loginBtn");
        const error = document.getElementById("error");

        if(!id || !pass) { error.innerText = "入力してください"; return; }
        btn.disabled = true; btn.innerText = "認証中...";

        try {
            const response = await fetch(`${GAS_URL}?id=${id}&pass=${pass}`);
            const result = await response.json();

            if (result.success) {
                localStorage.setItem('waddy_id', id);
                localStorage.setItem('waddy_pass', pass);
                const userData = {
                    id: id,
                    name: result.name,
                    role: result.role,
                    img: result.img || "https://via.placeholder.com/150",
                    message: result.message,
                    lastPasswordUpdate: result.lastPasswordUpdate // GASから取得
                };
                localStorage.setItem('waddy_user', JSON.stringify(userData));
                showMyPage(userData);
            } else {
                error.innerText = result.message;
            }
        } catch (e) {
            error.innerText = "通信エラーが発生しました";
        } finally {
            btn.disabled = false; btn.innerText = "ログイン";
        }
    }

    function showMyPage(user) {
        document.getElementById("login-form").classList.add("hidden");
        document.getElementById("staff-page").classList.remove("hidden");
        
        document.getElementById("welcome-msg").innerText = user.name + " さん";
        document.getElementById("user-role").innerText = user.role || "社員";
        document.getElementById("user-msg").innerText = user.message || "指示なし";
        document.getElementById("user-img").src = user.img || "https://via.placeholder.com/150";

        // パスワードチェック実行
        checkPasswordStatus(user);
    }

    function checkPasswordStatus(user) {
        const lastUpdateStr = user.lastPasswordUpdate;
        const popup = document.getElementById('pw-check-popup');
        const title = document.getElementById('pw-popup-title');
        const msg = document.getElementById('pw-popup-msg');
        const nextBtn = document.getElementById('pw-next-btn');
        const laterBtn = document.getElementById('pw-later-btn');

        // ① 初回（初期パスワード）判定
        if (!lastUpdateStr || lastUpdateStr === "") {
            title.innerText = "初期パスワードの変更";
            msg.innerText = "安全のため、初回ログイン時に独自のパスワードへ変更する必要があります。";
            laterBtn.style.display = "none"; 
            nextBtn.onclick = () => { window.location.href = "pw-change.html?mode=force"; };
            popup.style.display = "flex";
            return;
        }

        // ② 半年経過判定 (180日)
        const lastUpdate = new Date(lastUpdateStr);
        const diffDays = Math.floor((new Date() - lastUpdate) / (1000 * 60 * 60 * 24));
        if (diffDays >= 180 && !sessionStorage.getItem('pw_skipped')) {
            title.innerText = "パスワードの更新時期";
            msg.innerText = "前回の変更から180日以上経過しました。セキュリティのため更新をお願いします。";
            laterBtn.style.display = "inline-block";
            nextBtn.onclick = () => { window.location.href = "pw-change.html?mode=optional"; };
            popup.style.display = "flex";
        }
    }

    function closePwPopup() {
        sessionStorage.setItem('pw_skipped', 'true');
        document.getElementById('pw-check-popup').style.display = 'none';
    }

    async function updateIcon() {
        const newUrl = document.getElementById('new-img-url').value;
        const id = localStorage.getItem('waddy_id');
        if (!newUrl) return alert("URLを入力してください");
        try {
            const res = await fetch(GAS_URL, {
                method: 'POST',
                body: JSON.stringify({ id: id, imgUrl: newUrl })
            });
            const result = await res.json();
            if (result.success) {
                let userData = JSON.parse(localStorage.getItem('waddy_user'));
                userData.img = newUrl;
                localStorage.setItem('waddy_user', JSON.stringify(userData));
                document.getElementById('user-img').src = newUrl;
                alert("更新しました！");
            }
        } catch (e) { alert("失敗しました"); }
    }

    function logout() {
        localStorage.clear();
        window.location.href = "index.html";
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>ワッディードックプロジェクト</title>
    <style>
        /* 全体のスタイル */
        body { font-family: "Helvetica Neue", Arial, sans-serif; margin: 0; color: #333; line-height: 1.6; }
        
        /* ヘッダー（メニュー） */
        header { background: #fff; padding: 20px 50px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .logo { font-size: 1.5em; font-weight: bold; color: #4285f4; }
        nav a { margin-left: 20px; text-decoration: none; color: #666; font-size: 0.9em; }

        /* メイン画像（ヒーローセクション） */
        .hero { background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=1200&q=80'); 
                background-size: cover; background-position: center; height: 400px; display: flex; align-items: center; justify-content: center; color: white; text-align: center; }
        .hero h1 { font-size: 3em; margin: 0; }

        /* 会社概要セクション */
        .section { padding: 80px 50px; max-width: 900px; margin: auto; }
        .section h2 { border-bottom: 3px solid #4285f4; display: inline-block; margin-bottom: 30px; }
        .services { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .service-card { background: #f9f9f9; padding: 20px; border-radius: 8px; text-align: center; }

        /* フッター */
        footer { background: #333; color: white; text-align: center; padding: 30px; margin-top: 50px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">ワッディードックプロジェクト</div>
        <nav>
    <a href="index.html">ホーム</a>
    <a href="member.html">メンバー</a>
</nav>
    </header>

    <div class="hero">
        <div>
            <h1>未来を、私たちで加速させる。</h1>
            <p>お客様のお金は最後まで搾り取ります</p>
        </div>
    </div>

    <div class="section">
        <h2>私たちができること</h2>
        <div class="services">
            <div class="service-card">
                <h3>映画製作</h3>
                <p>現在二丁の光（主演：小掠大地）を製作中です</p>
            </div>
            <div class="service-card">
                <h3>借金徴収</h3>
                <p>スペシャリストにより徴収します</p>
        </div>
            <div class="service-card">
                <h3>仕方ないから</h3>
                <p>メンバーページの(前田愛生に)のとこを(前田愛生)にしてあげました</p>
                </div>
    </div>

    <footer>
        &copy; 2026 ワッディードックプロジェクト
    </footer>

</body>

</html>

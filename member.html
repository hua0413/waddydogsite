<!DOCTYPE html>
<html lang="ja">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>メンバー紹介 - ワッディードックプロジェクト</title>
    
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* 例：メンバー紹介のリストだけ少しこだわりたい場合など */
        li strong { display: inline-block; width: 140px; color: #4285f4; }
        @media (max-width: 768px) {
            li strong { display: block; width: auto; }
        }
    </style>
</head>
<body>
    <header>
    <a href="index.html" class="logo">ワッディードックプロジェクト</a>
    <nav>
        <a href="index.html">ホーム</a>
        <a href="member.html">メンバー</a>
        <a href="blog.html">活動報告</a>
        <div id="auth-button-area">
    <a href="login.html" class="btn">社員専用</a>
</div>
    </nav>
</header>

    <div class="content">
        <h1>メンバー紹介</h1>
        <ul>
            <li><strong>代表兼徴収人:</strong> 和田 大地</li>
            <li><strong>副代表兼徴収人:</strong> 小掠 大地</li>
            <li><strong>会長:</strong> 坂口 心風</li>
            <li><strong>副会長:</strong> 森田 董伊</li>
            <li><strong>経理:</strong> 山田 悠斗</li>
            <li><strong>団員長:</strong> 打田 理一</li>
            <li><strong>団員:</strong> 前田 愛生</li>
            <li><strong>団員:</strong> 小田谷 橙良</li>
            <li><strong>団員:</strong> マルティニト ナタニエル デ ルナ</li>
        </ul>
        <a href="index.html" class="back-home">← ホームに戻る</a>
    </div>
    <script>
window.addEventListener('DOMContentLoaded', () => {
    // ブラウザの記憶を確認
    const userData = JSON.parse(localStorage.getItem('waddy_user'));
    const authArea = document.getElementById('auth-button-area');

    if (userData && authArea) {
        // ログインしていれば、ボタンをアイコンと名前に書き換える
        authArea.innerHTML = `
            <a href="login.html" class="user-chip">
                <img src="${userData.img}" alt="avatar">
                <span>${userData.name}</span>
            </a>
        `;
    }
});
</script>
</body>
</html>

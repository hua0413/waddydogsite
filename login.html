<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社員ログイン - ワッディードック</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background-color: #f4f7f8; font-family: sans-serif; }
        .login-container { 
            max-width: 450px; 
            margin: 50px auto; 
            padding: 30px; 
            background: #ffffff; 
            border-radius: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            text-align: center; 
        }
        .hidden { display: none; }
        input { 
            width: 90%; 
            padding: 12px; 
            margin: 10px 0; 
            border: 1px solid #ddd; 
            border-radius: 8px; 
            font-size: 16px;
        }
        button { 
            width: 95%; 
            padding: 12px; 
            background: #4285f4; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 16px;
            transition: 0.3s;
        }
        button:hover { background: #357ae8; }
        button:disabled { background: #ccc; }
        
        /* 社員情報のデザイン */
        .profile-card {
            text-align: left;
            background: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            border-left: 5px solid #4285f4;
        }
        .role-badge {
            display: inline-block;
            background: #e8f0fe;
            color: #4285f4;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        #error { color: #ff4d4d; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="login-form" class="login-container">
        <h2>社員ログイン</h2>
        <p>IDとパスワードを入力してください</p>
        <input type="text" id="userId" placeholder="社員ID">
        <input type="password" id="userPass" placeholder="パスワード">
        <button id="loginBtn" onclick="login()">ログイン</button>
        <p id="error"></p>
    </div>

    <div id="staff-page" class="login-container hidden">
        <div class="role-badge" id="user-role">役職</div>
        <h2 id="welcome-msg">ようこそ</h2>
        
        <div class="profile-card">
            <p><strong>【あなたへの個別連絡】</strong></p>
            <p id="user-msg">メッセージを読み込んでいます...</p>
        </div>

        <br>
        <button onclick="location.reload()" style="background: #666;">ログアウト</button>
    </div>

    <script>
        // 💡 1. デプロイしたウェブアプリのURLに書き換えてください
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwIguaS571VqZfqvw19_LkkU124yR-XB4TB1R0MBpiQpDGZHNQDB6b_Y_cB1NzjSpeL/exec"; 

        async function login() {
            const id = document.getElementById("userId").value;
            const pass = document.getElementById("userPass").value;
            const btn = document.getElementById("loginBtn");
            const errorElement = document.getElementById("error");

            if (!id || !pass) {
                errorElement.innerText = "IDとパスワードを入力してください";
                return;
            }

            btn.disabled = true;
            btn.innerText = "照合中...";
            errorElement.innerText = "";

            try {
                // GASに問い合わせ
                const response = await fetch(`${GAS_URL}?id=${id}&pass=${pass}`);
                const result = await response.json();

                if (result.success) {
                    // ログイン成功：各情報を画面にセット
                    document.getElementById("login-form").classList.add("hidden");
                    document.getElementById("staff-page").classList.remove("hidden");
                    
                    document.getElementById("welcome-msg").innerText = result.name + " さん";
                    document.getElementById("user-role").innerText = result.role || "社員";
                    document.getElementById("user-msg").innerText = result.message || "現在、個別メッセージはありません。";
                } else {
                    // ログイン失敗
                    errorElement.innerText = result.message || "IDまたはパスワードが違います";
                }
            } catch (e) {
                errorElement.innerText = "通信エラーが発生しました";
                console.error(e);
            } finally {
                btn.disabled = false;
                btn.innerText = "ログイン";
            }
        }
    </script>
</body>
</html>

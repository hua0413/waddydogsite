<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaddyDog Portal | 社員専用ページ</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --accent-yellow: #f59e0b;
        }

        body {
            margin: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        /* ログイン画面のデザイン */
        .login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        /* マイページ全体のデザイン（PC対応） */
        .dashboard {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            display: grid;
            grid-template-columns: 300px 1fr; /* 左にプロフィール、右にコンテンツ */
            gap: 30px;
        }

        @media (max-width: 768px) {
            .dashboard { grid-template-columns: 1fr; } /* スマホでは縦並び */
        }

        /* 左側：プロフィールカード */
        .side-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            text-align: center;
            height: fit-content;
        }

        .avatar-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 20px;
            border: 4px solid var(--primary-color);
            object-fit: cover;
            background: #eee;
        }

        .badge {
            background: #dbeafe;
            color: var(--primary-color);
            padding: 4px 12px;
            border-radius: 99px;
            font-weight: bold;
            font-size: 14px;
        }

        /* 右側：コンテンツエリア */
        .main-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .status-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* 進捗バーの豪華版 */
        .progress-wrapper {
            background: #e2e8f0;
            border-radius: 10px;
            height: 24px;
            margin: 15px 0;
            position: relative;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #2563eb, #60a5fa);
            height: 100%;
            width: 0%;
            transition: width 1.5s cubic-bezier(0.1, 0, 0, 1);
        }

        /* メッセージ板のデザイン */
        .memo-area {
            background: #fffbeb;
            border-left: 6px solid var(--accent-yellow);
            padding: 20px;
            border-radius: 12px;
            font-size: 18px;
            line-height: 1.6;
        }

        /* 共通ボタン */
        .btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn:hover { transform: translateY(-2px); opacity: 0.9; }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .hidden { display: none; }
        /* 追加：ホーム戻るボタンのデザイン */
.back-to-home {
    position: absolute;
    top: 20px;
    left: 20px;
    text-decoration: none;
    color: #64748b;
    font-size: 14px;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: 0.3s;
    padding: 8px 16px;
    background: white;
    border-radius: 8px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
}

.back-to-home:hover {
    color: var(--primary-color);
    transform: translateX(-3px);
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

/* スマホでは少し位置を調整 */
@media (max-width: 768px) {
    .back-to-home {
        top: 10px;
        left: 10px;
    }
}
    </style>
</head>
<body>
    <a href="index.html" class="back-to-home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        ホームへ戻る
    </a>

<div id="login-form" class="login-screen">
    <div class="login-card">
        <h2 style="margin-bottom: 8px;">WaddyDog Portal</h2>
        <p style="color: #64748b; margin-bottom: 24px;">社員認証を行ってください</p>
        <input type="text" id="userId" placeholder="社員ID">
        <input type="password" id="userPass" placeholder="パスワード">
        <button id="loginBtn" class="btn" style="width: 100%; margin-top: 10px;" onclick="login()">ログイン</button>
        <p id="error" style="color: #ef4444; margin-top: 15px; font-size: 14px;"></p>
    </div>
</div>

<div id="staff-page" class="dashboard hidden">
    <aside class="side-card">
        <img id="user-img" src="https://via.placeholder.com/150" class="avatar-circle">
        <div style="margin-bottom: 10px;"><span id="user-role" class="badge">役職</span></div>
        <h2 id="welcome-msg" style="margin: 10px 0;">名前 さん</h2>
        <p style="color: #64748b; font-size: 14px;">WaddyDog Projectメンバー</p>
        <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 20px 0;">
        <button onclick="logout()" class="btn" style="background: #64748b; width: 100%;">ログアウト</button>
    </aside>

    <main class="main-content">
        <div class="status-card">
            <h3 style="margin-top: 0;">📊 個人進捗ステータス</h3>
            <div class="progress-wrapper">
                <div id="progress-fill" class="progress-fill"></div>
            </div>
            <div style="display: flex; justify-content: space-between; font-weight: bold;">
                <span>達成度</span>
                <span><span id="progress-text">0</span>%</span>
            </div>
        </div>

        <div class="status-card">
            <h3 style="margin-top: 0;">✉️ あなたへの個別指示</h3>
            <div id="user-msg" class="memo-area">
                指示事項を読み込んでいます...
            </div>
        </div>

        <div class="status-card">
            <h3 style="margin-top: 0;">📢 全社共通トピックス</h3>
            <ul style="padding-left: 20px; color: #475569;">
                <li>社員専用ページ完成！</li>
                <li>投稿は考えてリクエストするように</li>
            </ul>
        </div>
        <div class="status-card" style="margin-top: 20px; border-top: 2px solid #eee; padding-top: 20px;">
    <h3>⚙️ プロフィール設定</h3>
    <p style="font-size: 13px; color: #666;">アイコン画像のURLを入力してください</p>
    <input type="text" id="new-img-url" placeholder="https://example.com/image.jpg" style="font-size: 14px;">
    <button onclick="updateIcon()" class="btn" style="background: #34a853; margin-top: 5px;">アイコンを更新</button>
</div>
    </main>
</div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwIguaS571VqZfqvw19_LkkU124yR-XB4TB1R0MBpiQpDGZHNQDB6b_Y_cB1NzjSpeL/exec"; 

    // ページ読み込み時の処理
window.addEventListener('DOMContentLoaded', async () => {
    const savedUser = JSON.parse(localStorage.getItem('waddy_user'));
    const savedId = localStorage.getItem('waddy_id');
    const savedPass = localStorage.getItem('waddy_pass');

    // 1. まずはブラウザの記憶で即座に表示（これでアイコンは一旦出る）
    if (savedUser) {
        showMyPage(savedUser);
    }

    // 2. 最新データを取得して同期する
    if (savedId && savedPass) {
        try {
            const response = await fetch(`${GAS_URL}?id=${savedId}&pass=${savedPass}`);
            const result = await response.json();
            
            if (result.success) {
                // ここがポイント：新しいデータに画像があればそれを使う。
                // もし新しいデータに画像がなければ、今表示している(savedUserの)画像を維持する。
                const updatedUser = {
                    name: result.name,
                    role: result.role,
                    img: result.img || (savedUser ? savedUser.img : "https://via.placeholder.com/150"),
                    message: result.message,
                    progress: result.progress
                };

                // ブラウザの記憶を最新版（画像維持）で上書き
                localStorage.setItem('waddy_user', JSON.stringify(updatedUser));
                
                // 画面を最新状態で更新
                showMyPage(updatedUser);
            }
        } catch (e) {
            console.error("同期失敗:", e);
        }
    }
});

    // ログイン処理
    async function login() {
        const id = document.getElementById("userId").value;
        const pass = document.getElementById("userPass").value;
        const btn = document.getElementById("loginBtn");
        const error = document.getElementById("error");

        if(!id || !pass) { error.innerText = "入力してください"; return; }

        btn.disabled = true;
        btn.innerText = "認証中...";

        try {
            const response = await fetch(`${GAS_URL}?id=${id}&pass=${pass}`);
            const result = await response.json();

            if (result.success) {
                // データの保存
                localStorage.setItem('waddy_id', id);
                localStorage.setItem('waddy_pass', pass);
                const userData = {
                    name: result.name,
                    role: result.role,
                    img: result.img || "https://via.placeholder.com/150",
                    message: result.message,
                    progress: result.progress
                };
                localStorage.setItem('waddy_user', JSON.stringify(userData));

                // 画面切り替え
                showMyPage(userData);
            } else {
                error.innerText = result.message;
            }
        } catch (e) {
            error.innerText = "通信エラーが発生しました";
        } finally {
            btn.disabled = false;
            btn.innerText = "ログイン";
        }
    }

    // マイページ表示（共通）
    function showMyPage(user) {
        document.getElementById("login-form").classList.add("hidden");
        document.getElementById("staff-page").classList.remove("hidden");
        
        document.getElementById("welcome-msg").innerText = user.name + " さん";
        document.getElementById("user-role").innerText = user.role || "社員";
        document.getElementById("user-msg").innerText = user.message || "指示なし";
        document.getElementById("user-img").src = user.img || "https://via.placeholder.com/150";
        
        const p = user.progress || 0;
        setTimeout(() => {
            const fill = document.getElementById("progress-fill");
            if(fill) fill.style.width = p + "%";
            const text = document.getElementById("progress-text");
            if(text) text.innerText = p;
        }, 300);
    }

    // アイコン更新
    async function updateIcon() {
        const newUrl = document.getElementById('new-img-url').value;
        const savedId = localStorage.getItem('waddy_id');

        if (!newUrl) return alert("URLを入力してください");

        try {
            const response = await fetch(GAS_URL, {
                method: 'POST',
                body: JSON.stringify({ id: savedId, imgUrl: newUrl })
            });
            const result = await response.json();

            if (result.success) {
                let userData = JSON.parse(localStorage.getItem('waddy_user'));
                userData.img = newUrl; 
                localStorage.setItem('waddy_user', JSON.stringify(userData));
                
                document.getElementById('user-img').src = newUrl;
                alert("アイコンを更新しました！");
            }
        } catch (e) {
            alert("更新に失敗しました。");
        }
    }

    // ログアウト
    function logout() {
        localStorage.removeItem('waddy_user');
        localStorage.removeItem('waddy_id');
        localStorage.removeItem('waddy_pass');
        window.location.href = "index.html";
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaddyDog Portal | 社員専用ページ</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ここにお手持ちのFirebase Configを貼り付けてください
        const firebaseConfig = {
    apiKey: "AIzaSyCWP-3yPtIoghRcF0AZwqFTMfNvH1kpZ9o",
    authDomain: "waddy-portal.firebaseapp.com",
    projectId: "waddy-portal",
    storageBucket: "waddy-portal.firebasestorage.app",
    messagingSenderId: "89997369271",
    appId: "1:89997369271:web:ea882a0832054a71655232"
  };


        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.firebaseUtils = { db, collection, addDoc, serverTimestamp };
    </script>
    <style>
        :root {
            --primary-color: #2563eb; --bg-color: #f8fafc; --card-bg: #ffffff;
            --text-main: #1e293b; --accent-yellow: #f59e0b; --accent-green: #059669;
        }
        body { margin: 0; font-family: sans-serif; background: var(--bg-color); color: var(--text-main); }
        .hidden { display: none !important; }
        .login-screen { display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .dashboard { max-width: 1200px; margin: 0 auto; padding: 40px 20px; display: grid; grid-template-columns: 300px 1fr; gap: 30px; }
        @media (max-width: 768px) { .dashboard { grid-template-columns: 1fr; } .pc-only { display: none !important; } .mobile-notice { display: block !important; } }
        .side-card { background: white; padding: 30px; border-radius: 24px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; }
        .avatar-circle { width: 120px; height: 120px; border-radius: 50%; border: 4px solid var(--primary-color); margin-bottom: 20px; object-fit: cover; }
        .memo-area { background: #fffbeb; border-left: 6px solid var(--accent-yellow); padding: 20px; border-radius: 12px; margin-top: 10px; }
        .btn { background: var(--primary-color); color: white; border: none; border-radius: 12px; padding: 12px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; text-decoration: none; display: block; box-sizing: border-box; }
        .auth-input { text-align: center; letter-spacing: 8px; font-size: 24px; font-weight: bold; color: var(--primary-color); }
        .mobile-notice { display: none; font-size: 12px; color: #94a3b8; margin-top: 10px; padding: 8px; background: #f1f5f9; border-radius: 8px; }
        #pw-check-popup { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 1000; }
        .popup-card { background: white; padding: 30px; border-radius: 20px; text-align: center; max-width: 350px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
    </style>
</head>
<body>
<div id="login-form" class="login-screen">
    <div id="loading" style="text-align:center; padding-top:100px;">
    <p>読み込み中...</p>
</div>
    <div class="login-card">
        <h2>WaddyDog Portal</h2>
        
        <div id="login-main">
            <input type="text" id="userId" placeholder="社員ID">
            <input type="password" id="userPass" placeholder="パスワード">
            <button id="loginBtn" class="btn" onclick="login()">ログイン</button>
            <button onclick="showForgotOptions()" style="background:none; border:none; color:var(--primary-color); cursor:pointer; font-size:13px; margin-top:15px; text-decoration:underline;">パスワードを忘れた場合</button>
        </div>

        <div id="forgot-options" class="hidden">
            <h3>再設定方法を選択</h3>
            <button class="btn" onclick="showAuthRegister()" style="background:#1e293b;">Google Authenticatorで認証</button>
            <button class="btn" onclick="handleAdminReset()" style="background:#64748b;">管理者に初期化を依頼</button>
            <button onclick="hideForgotOptions()" style="background:none; border:none; color:#94a3b8; cursor:pointer; font-size:12px; margin-top:15px;">キャンセル</button>
        </div>

        <div id="auth-register-guide" class="hidden">
            <h3>アプリの登録</h3>
            <div style="background:#f1f5f9; padding:15px; border-radius:10px; margin:10px 0;">
        <p style="font-size:12px;">以下のQRコードを認証アプリでスキャンしてください</p>
        <img id="auth-qr" src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=otpauth://totp/WaddyPortal?secret=JBSWY3DPEHPK3PXP&issuer=WaddyDog" style="margin:10px 0;">
        <p style="font-size:12px;">または以下のコードを認証アプリに入力してください</p>
        <p style="font-size:15px; color:#64748b;">コード名：WaddyPortal</p>
        <p style="font-size:15px; color:#64748b;">キー：JBSWY3DPEHPK3PXP</p>
    </div>
            <button class="btn" onclick="showAuthInput()">次へ</button>
            <button onclick="showForgotOptions()" style="border:none; background:none; font-size:12px; color:#94a3b8; margin-top:10px;">戻る</button>
        </div>

        <div id="auth-reset-area" class="hidden">
            <p>6桁の認証コードを入力</p>
            <input type="text" id="authCode" class="auth-input" placeholder="000000" maxlength="6">
            <button id="authVerifyBtn" class="btn" onclick="executeAuthVerify()">認証して進む</button>
            <button onclick="showAuthRegister()" style="border:none; background:none; font-size:12px; color:#94a3b8; margin-top:10px;">戻る</button>
        </div>

        <div id="admin-request-done" class="hidden">
            <div style="font-size:40px;">📨</div>
            <h3>依頼を送信しました</h3>
            <button onclick="location.reload()" class="btn">戻る</button>
        </div>
        <p id="error" style="color:red; font-size:13px;"></p>
    </div>
</div>

<div id="staff-page" class="dashboard hidden">
    <aside class="side-card">
        <button onclick="home()" class="btn" style="background:#cccccc;">🏠 ホームへ</button>
        <div style="height: 25px;"></div>
        <img id="user-img" src="" class="avatar-circle">
        <h2 id="welcome-msg">名前 さん</h2>
        <a href="mail.html" class="btn pc-only" style="background:var(--accent-green);">📩 社内メールを確認</a>
        <div class="mobile-notice">📩 メールはPC版限定です</div>
        <button onclick="window.location.href='pw-change.html?mode=anytime'" class="btn" style="background:#1e293b; font-size:13px;">🔒 パスワード変更</button>
        <button onclick="logout()" class="btn" style="background:#64748b;">ログアウト</button>
    </aside>
    <main class="main-content">
        <div style="background:white; padding:25px; border-radius:24px;">
            <h3>✉️ 個別指示</h3>
            <div id="user-msg" class="memo-area"></div>
        </div>
        <div class="status-card" style="margin-top: 20px; border-top: 2px solid #eee; padding-top: 20px;">
    <h3>⚙️ プロフィール設定</h3>
    <p style="font-size: 13px; color: #666;">アイコン画像のURLを入力してください</p>
    <input type="text" id="new-img-url" placeholder="https://example.com/image.jpg" style="font-size: 14px;">
    <button onclick="updateIcon()" class="btn" style="background: #34a853; margin-top: 5px;">アイコンを更新</button>
</div>
    </main>
</div>

<div id="pw-check-popup">
    <div class="popup-card">
        <h2 id="pw-popup-title"></h2>
        <p id="pw-popup-msg" style="font-size:14px; color:#666;"></p>
        <button id="pw-next-btn" class="btn">変更画面へ</button>
        <button id="pw-later-btn" onclick="closePwPopup()" style="display:none; background:none; border:none; color:#999; margin-top:10px; cursor:pointer;">後で</button>
    </div>
</div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwIguaS571VqZfqvw19_LkkU124yR-XB4TB1R0MBpiQpDGZHNQDB6b_Y_cB1NzjSpeL/exec";
    const DEFAULT_PW = "pass1234";
    const ADMIN_ID = "W001";
    // ページ読み込み時に実行
window.onload = () => {
    document.getElementById("login-form").classList.add("hidden");
    const savedUser = localStorage.getItem('waddy_user');
    const savedPass = localStorage.getItem('waddy_pass_input');
    
    if (savedUser && savedPass) {
        // ログイン済みの場合
        showMyPage(JSON.parse(savedUser), savedPass);
        document.getElementById("loading").style.display = "none";
    } else {
        // 未ログインの場合：ログイン画面をパッと出す
        setTimeout(() => {
    // 3秒経ったら「読み込み中」を消す
    document.getElementById("loading").style.display = "none";
            document.getElementById("login-form").classList.remove("hidden");
}, 3000);
    }
};

    async function login() {
        const id = document.getElementById("userId").value;
        const pass = document.getElementById("userPass").value;
        const err = document.getElementById("error");
        if(!id || !pass) return;

        try {
            const res = await fetch(`${GAS_URL}?id=${id}&pass=${pass}`);
            const result = await res.json();
            if (result.success) {
                localStorage.setItem('waddy_id', id);
                localStorage.setItem('waddy_pass_input', pass);
                localStorage.setItem('waddy_user', JSON.stringify(result));
                showMyPage(result, pass);
            } else { err.innerText = result.message; }
        } catch (e) { err.innerText = "通信エラー"; }
    }

    function showMyPage(user, inputPass) {
        document.getElementById("login-form").classList.add("hidden");
        document.getElementById("staff-page").classList.remove("hidden");
        document.getElementById("welcome-msg").innerText = user.name + " さん";
        document.getElementById("user-msg").innerText = user.message || "指示なし";
        document.getElementById("user-img").src = user.img || "https://via.placeholder.com/150";
        checkPasswordStatus(user, inputPass);
    }

    function checkPasswordStatus(user, inputPass) {
        const popup = document.getElementById('pw-check-popup');
        const nextBtn = document.getElementById('pw-next-btn');
        const laterBtn = document.getElementById('pw-later-btn');
        
        if (inputPass === DEFAULT_PW) {
            document.getElementById('pw-popup-title').innerText = "パスワード変更が必要です";
            document.getElementById('pw-popup-msg').innerText = "初期パスワードは変更してください。";
            nextBtn.onclick = () => location.href="pw-change.html?mode=force";
            popup.style.display = "flex";
        }
    }

    // --- Authenticator & Firebase系 ---
    function showForgotOptions() { document.getElementById('login-main').classList.add('hidden'); document.getElementById('forgot-options').classList.remove('hidden'); document.getElementById('auth-register-guide').classList.add('hidden');}
    function hideForgotOptions() { document.getElementById('login-main').classList.remove('hidden'); document.getElementById('forgot-options').classList.add('hidden'); }
    function showAuthRegister() { document.getElementById('forgot-options').classList.add('hidden'); document.getElementById('auth-register-guide').classList.remove('hidden'); document.getElementById('auth-reset-area').classList.add('hidden');}
    function showAuthInput() { document.getElementById('auth-register-guide').classList.add('hidden'); document.getElementById('auth-reset-area').classList.remove('hidden'); }

    async function executeAuthVerify() {
    const authBtn = document.getElementById("authVerifyBtn"); // ボタンを取得
    const code = document.getElementById("authCode").value;
    const id = document.getElementById("userId").value;

    if (!code) return alert("コードを入力してください");

    // --- 演出開始 ---
    const originalText = authBtn.innerText; // 元の文字（認証して進む）を覚えておく
    authBtn.innerText = "⏳ 認証中...";      // 文字を変える
    authBtn.disabled = true;                // ボタンを押せないようにする
    authBtn.style.opacity = "0.7";          // ちょっと薄くする

    try {
        const res = await fetch(`${GAS_URL}?mode=verifyAuth&code=${code}`);
        const result = await res.json();

        if (result.success) {
            authBtn.innerText = "✅ 成功！";
            setTimeout(() => {
                window.location.href = `pw-change.html?mode=reset&id=${id}&auth=ok`;
            }, 1000); // 0.5秒だけ「成功」を見せてから移動
        } else {
            alert(result.message || "コードが違います");
            // 失敗したら元に戻す
            authBtn.innerText = originalText;
            authBtn.disabled = false;
            authBtn.style.opacity = "1";
        }
    } catch (e) {
        alert("通信エラーが発生しました");
        // エラーでも元に戻す
        authBtn.innerText = originalText;
        authBtn.disabled = false;
        authBtn.style.opacity = "1";
    }
}

    async function handleAdminReset() {
        const id = document.getElementById("userId").value;
        if (!id) return alert("IDを入力してください");
        try {
            const { db, collection, addDoc, serverTimestamp } = window.firebaseUtils;
            await addDoc(collection(db, "messages"), {
                senderId: "SYSTEM_BOT",
                receiverIds: ADMIN_ID,
                subject: "【緊急】パスワード初期化依頼",
                body: `社員ID: ${id} からの依頼です。`,
                timestamp: serverTimestamp(),
                readBy: []
            });
            document.getElementById('forgot-options').classList.add('hidden');
            document.getElementById('admin-request-done').classList.remove('hidden');
        } catch (e) { alert("送信エラー"); }
    }

    function logout() { localStorage.clear(); location.href = "index.html"; }
    function home() { location.href = "index.html"; }
    function closePwPopup() { document.getElementById('pw-check-popup').style.display = 'none'; }
     async function updateIcon() {
        const newUrl = document.getElementById('new-img-url').value;
        const savedId = localStorage.getItem('waddy_id');

        if (!newUrl) return alert("URLを入力してください");

        try {
            const response = await fetch(GAS_URL, {
                method: 'POST',
                body: JSON.stringify({ id: savedId, imgUrl: newUrl })
            });
            const result = await response.json();

            if (result.success) {
                let userData = JSON.parse(localStorage.getItem('waddy_user'));
                userData.img = newUrl; 
                localStorage.setItem('waddy_user', JSON.stringify(userData));
                
                document.getElementById('user-img').src = newUrl;
                alert("アイコンを更新しました！");
            }
        } catch (e) {
            alert("更新に失敗しました。");
        }
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>ワッディードックプロジェクト</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <a href="index.html" class="logo">ワッディードックプロジェクト</a>
    <nav>
        <a href="index.html">ホーム</a>
        <a href="member.html">メンバー</a>
        <a href="blog.html">活動報告</a>
        <div id="auth-button-area">
        <a href="login.html" class="btn">社員専用</a>
        </div>
    </nav>
</header>

    <div class="hero">
        <div>
            <h1>未来を、私たちで加速させる。</h1>
            <p>お客様のお金は最後まで搾り取ります。もう寝るね、</p>
        </div>
    </div>

    <div class="section">
        <h2>私たちができること</h2>
        <div class="services">
            <div class="service-card">
                <h3>製作事業</h3>
                <p>現在二丁の光（主演：小掠大地）を製作中です</p>
            </div>
            <div class="service-card">
                <h3>借金徴収</h3>
                <p>スペシャリストにより迅速・丁寧に徴収します</p>
            </div>
            <div class="service-card">
                <h3>～卒業～</h3>
                <p>中学校を卒業し、それぞれの道へ。新たなステージでも加速し続けます。</p>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 ワッディードックプロジェクト</p>
        <p style="opacity: 0.7;">※この団体は架空であり、実際の活動はしておりません。</p>
    </footer>
<script>
    // 1. 【ここを追加】一番最初にURLを宣言する
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwIguaS571VqZfqvw19_LkkU124yR-XB4TB1R0MBpiQpDGZHNQDB6b_Y_cB1NzjSpeL/exec";
    async function checkMaintenance() {
    try {
        const response = await fetch(GAS_URL);
        const result = await response.json();

        // メンテナンス中の場合
        if (result.maintenance === true) {
            // maintenance.html へ強制移動（ただし自分自身がそうならループするので除外）
            if (!window.location.href.includes("maintenance.html")) {
                window.location.href = "maintenance.html";
            }
        }
    } catch (e) {
        console.error("メンテナンスチェック失敗", e);
    }
}

// ページ読み込み時に実行
window.addEventListener('DOMContentLoaded', checkMaintenance);

// ページ内移動（ハッシュ変更など）も監視したい場合はこれ
window.addEventListener('hashchange', checkMaintenance);
// ページが読み込まれたら実行
window.addEventListener('DOMContentLoaded', () => {
    const userData = JSON.parse(localStorage.getItem('waddy_user'));
    const authArea = document.getElementById('auth-button-area');

    if (userData && authArea) {
        // ログイン情報があれば、ボタンを「アイコン＋名前」に書き換える
        authArea.innerHTML = `
            <a href="login.html" class="user-chip">
                <img src="${userData.img}" alt="avatar">
                <span>${userData.name}</span>
            </a>
        `;
    }
});
</script>
</body>
</html>
